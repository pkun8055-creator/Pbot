<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ステータス | ぴーbot</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />

<style>
:root{
  --bg: #0b1120;
  --card: #161e2e;
  --accent: #22c55e;
  --text: #f8fafc;
  --sub-text: #94a3b8;
  --nav-bg: rgba(11, 17, 32, 0.8);
}

body.light{
  --bg: #f8fafc;
  --card: #ffffff;
  --text: #0f172a;
  --sub-text: #64748b;
  --nav-bg: rgba(248, 250, 252, 0.8);
}

body {
  margin: 0;
  font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
}

/* ==========================================
   ナビゲーション＆ハンバーガー
========================================== */
nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 5%;
  background: var(--nav-bg);
  backdrop-filter: blur(10px);
  position: sticky;
  top: 0;
  z-index: 1000;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

body.light nav {
  border-bottom: 1px solid rgba(0, 0, 0, 0.05);
}

nav .logo {
  font-size: 1.5rem;
  font-weight: 800;
  color: var(--accent);
}

nav .links {
  display: flex;
  align-items: center;
}

nav .links a {
  color: var(--text);
  text-decoration: none;
  margin-left: 15px;
  font-weight: 600;
  font-size: 0.9rem;
  transition: 0.2s;
}

nav .links a:hover {
  color: var(--accent);
}

/* ハンバーガーアイコン */
.menu-icon {
  display: none;
  width: 28px;
  height: 20px;
  position: relative;
  cursor: pointer;
  z-index: 1001;
}

.menu-icon span {
  position: absolute;
  width: 100%;
  height: 3px;
  background: var(--text);
  border-radius: 3px;
  transition: 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
}

.menu-icon span:nth-child(1) { top: 0; }
.menu-icon span:nth-child(2) { top: 50%; transform: translateY(-50%); }
.menu-icon span:nth-child(3) { bottom: 0; }

.menu-icon.active span:nth-child(1) { top: 50%; transform: translateY(-50%) rotate(45deg); }
.menu-icon.active span:nth-child(2) { opacity: 0; }
.menu-icon.active span:nth-child(3) { bottom: 50%; transform: translateY(50%) rotate(-45deg); }

.toggle-btn {
  background: rgba(0,0,0,0.2);
  color: var(--text);
  border: 1px solid rgba(128,128,128,0.3);
  padding: 6px 12px;
  border-radius: 12px;
  cursor: pointer;
  font-size: 1rem;
  margin-left: 15px;
}

body.light .toggle-btn { background: rgba(0,0,0,0.05); }

/* ==========================================
   メインコンテンツ
========================================== */
.container {
  max-width: 900px;
  margin: auto;
  padding: 60px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

h1 {
  text-align: center;
  font-size: 2.5rem;
  margin-bottom: 50px;
  /* 修正：背景色をグラデーションではなくシンプルにカラー指定することでアイコンの色破綻を防ぐ */
  color: var(--text);
}

/* ステータスセクション */
.status-section {
  background: var(--card);
  padding: 40px 20px;
  border-radius: 24px;
  width: 100%;
  max-width: 500px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  border: 1px solid rgba(255,255,255,0.03);
  text-align: center;
  box-sizing: border-box;
}

body.light .status-section {
  box-shadow: 0 10px 30px rgba(0,0,0,0.05);
  border: 1px solid rgba(0,0,0,0.05);
}

.status-section h2 {
  margin-top: 0;
  margin-bottom: 25px;
  color: var(--accent);
  font-size: 1.5rem;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
}

.status-box {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 12px 30px;
  background: rgba(0, 0, 0, 0.1);
  border-radius: 50px;
  font-weight: bold;
  font-size: 1.2rem;
  margin-bottom: 35px;
  border: 1px solid rgba(128,128,128,0.2);
}

.status-online { color: #22c55e; }
.status-offline { color: #ef4444; }

.widget-container { width: 100%; max-width: 350px; margin: 0 auto; }
iframe.discord-widget { border: none; border-radius: 16px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }

/* モーダル共通・フッターは他のページと同じのため省略 */
footer { text-align: center; padding: 60px 20px; font-size: 0.9rem; opacity: 0.6; }
footer a { color: var(--accent); text-decoration: none; margin: 0 10px; }

/* スマホ対応 */
@media (max-width: 768px) {
  .menu-icon { display: block; }
  nav .links {
    display: none;
    flex-direction: column;
    position: absolute;
    top: 100%;
    left: 0;
    width: 100%;
    background: var(--card);
    padding: 20px 0;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  nav .links.active { display: flex; }
  nav .links a { margin: 12px 0; }
  .toggle-btn { margin-left: 0; margin-top: 10px; padding: 10px 20px; }
}
</style>
</head>

<body>

<nav>
  <div class="logo">ぴーbot</div>
  <div class="menu-icon" onclick="toggleMenu()">
    <span></span>
    <span></span>
    <span></span>
  </div>
  <div class="links" id="navLinks">
    <a href="index.html">ホーム</a>
    <a href="commands.html">コマンド</a>
    <a href="faq.html">FAQ</a>
    <a href="Status.html">ステータス</a>
    <button class="toggle-btn" onclick="toggleMode()">🌓</button>
  </div>
</nav>

<div class="container">

  <h1><i class="fas fa-chart-line" style="color:var(--accent);"></i> システムステータス</h1>

  <section class="status-section">
    <h2><i class="fas fa-signal"></i> ぴーbot 稼働状況</h2>

    <div id="bot-status" class="status-box">
      <i class="fas fa-spinner fa-spin"></i> 確認中...
    </div>

    <div class="widget-container">
      <iframe 
        class="discord-widget"
        src="https://discord.com/widget?id=1474924120406888470&theme=dark" 
        height="500" 
        allowtransparency="true" 
        frameborder="0">
      </iframe>
    </div>
  </section>

</div>

<footer>
  <p>© 2026 ぴーbot | 開発: ぴー</p>
</footer>

<script>
function toggleMode(){ document.body.classList.toggle("light"); }
function toggleMenu() {
  document.getElementById('navLinks').classList.toggle('active');
  document.querySelector('.menu-icon').classList.toggle('active');
}

const BOT_NAME = "ぴーBot"; 
const GUILD_ID = "1474924120406888470"; 

async function checkBot() {
  try {
    const res = await fetch(`https://discord.com/api/guilds/${GUILD_ID}/widget.json`);
    const data = await res.json();
    const bot = data.members.find(m => (m.username && m.username.includes(BOT_NAME)) || (m.nick && m.nick.includes(BOT_NAME)));
    const statusBox = document.getElementById("bot-status");

    if (bot && bot.status === "online") {
      statusBox.innerHTML = "🟢 稼働中";
      statusBox.className = "status-box status-online";
    } else {
      statusBox.innerHTML = "🔴 オフライン";
      statusBox.className = "status-box status-offline";
    }
  } catch (e) {
    document.getElementById("bot-status").innerHTML = "⚠️ 取得失敗";
    document.getElementById("bot-status").style.color = "#94a3b8";
  }
}
checkBot();
setInterval(checkBot, 30000); 
</script>

</body>
</html>
